name: Historical frontier campaign (closed)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Frozen campaign phase; run each phase once
        required: true
        default: development-a
        type: choice
        options:
          - development-a
          - development-b
          - holdout
permissions:
  contents: read
concurrency:
  group: honeyweb-frontier
  cancel-in-progress: false
jobs:
  campaign:
    # The v1 holdout is consumed. Preserve history; use the v2 development workflow.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: honeyweb_case
          POSTGRES_PASSWORD: honeyweb_case
          POSTGRES_DB: honeyweb_case
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyweb_case -d honeyweb_case"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gothinkster/node-express-realworld-example-app
          ref: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
          path: .case/upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .case/upstream
      - run: npm run check
      - name: Run one frozen phase without retries
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
          DATABASE_URL: postgresql://honeyweb_case:honeyweb_case@127.0.0.1:5432/honeyweb_case?schema=public
          CAMPAIGN_PHASE: ${{ inputs.phase }}
        run: npm run evaluate:frontier -- --meta --phase="$CAMPAIGN_PHASE" --upstream=.case/upstream --output="frontier-$CAMPAIGN_PHASE.json"
      - name: Preserve every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-${{ inputs.phase }}
          path: frontier-${{ inputs.phase }}.json
          if-no-files-found: ignore
          retention-days: 14
