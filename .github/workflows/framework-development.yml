name: Framework development campaign
on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the prepared development campaign with Meta after resolving provider access
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: honeyweb-framework-development
  cancel-in-progress: false
jobs:
  development:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: honeyweb_case
          POSTGRES_PASSWORD: honeyweb_case
          POSTGRES_DB: honeyweb_case
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyweb_case -d honeyweb_case"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gothinkster/node-express-realworld-example-app
          ref: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
          path: .case/upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .case/upstream
      - run: npm run check
      - name: Restore the committed development manifest
        run: |
          mkdir -p artifacts/framework-v2
          cp case-studies/framework-v2/manifest.json artifacts/framework-v2/manifest.json
      - name: Run development only when explicitly selected
        if: inputs.run_live
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
          DATABASE_URL: postgresql://honeyweb_case:honeyweb_case@127.0.0.1:5432/honeyweb_case?schema=public
        run: npm run evaluate:framework -- --meta --upstream=.case/upstream --directory=artifacts/framework-v2
      - name: Preserve manifest and every checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-development-evidence
          path: artifacts/framework-v2/
          if-no-files-found: ignore
          retention-days: 14
