name: RealWorld application case study
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: honeyweb-realworld-case
  cancel-in-progress: false
jobs:
  realworld:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: honeyweb_case
          POSTGRES_PASSWORD: honeyweb_case
          POSTGRES_DB: honeyweb_case
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gothinkster/node-express-realworld-example-app
          ref: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
          path: .case/upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .case/upstream
      - run: npm run check
      - name: Run actual app, repeated HTTP discovery and controlled schema migration
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
          DATABASE_URL: postgresql://honeyweb_case:honeyweb_case@127.0.0.1:5432/honeyweb_case?schema=public
        run: npm run case:realworld -- --upstream=.case/upstream --meta --start-upstream --output=realworld-evaluation.json
      - name: Save redacted case-study evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworld-evaluation
          path: realworld-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
