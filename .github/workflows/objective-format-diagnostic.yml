name: Objective format diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Two bounded calls using a credential-free failed view
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
        run: node --import tsx scripts/diagnose-objective-format.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objective-format-diagnostic
          path: objective-format-diagnostic.json
          retention-days: 14
