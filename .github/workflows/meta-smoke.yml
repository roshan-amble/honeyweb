name: Live Meta smoke test

# Manual only: ordinary CI and PRs never receive the API secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: honeyweb-meta-smoke
  cancel-in-progress: false
jobs:
  live-meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Generate, independently explore, change source, regenerate and compare
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
        run: npm run evaluate -- --meta --output=meta-evaluation.json
      - name: Save redacted synthetic-fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-evaluation
          path: meta-evaluation.json
          if-no-files-found: ignore
          retention-days: 14
