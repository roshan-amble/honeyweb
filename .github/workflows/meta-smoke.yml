name: Live Meta smoke test

# Only explicit manual runs use the API key. PRs and ordinary pushes do not.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honeyweb-meta-smoke
  cancel-in-progress: false

jobs:
  live-meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate with Meta and traverse the resulting decoys
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_MODEL: muse-spark-1.3
        run: |
          node --import tsx --input-type=module <<'JS'
          import { createServer } from 'node:http';
          import { scanRepository } from './src/scanner.ts';
          import { generateWithMeta } from './src/meta.ts';
          import { DecoyRuntime, traverse } from './src/runtime.ts';

          let server;
          try {
            if (!process.env.MODEL_API_KEY) {
              throw new Error('Add the MODEL_API_KEY repository Actions secret first.');
            }
            const snapshot = await scanRepository('./fixtures/acme-v1');
            // Exactly one real generation request using only bundled synthetic metadata.
            const generation = await generateWithMeta(snapshot);
            const runtime = new DecoyRuntime(generation, snapshot);
            server = createServer(runtime.handle);
            await new Promise((resolve, reject) => {
              server.once('error', reject);
              server.listen(0, '127.0.0.1', resolve);
            });
            const address = server.address();
            await traverse(runtime, `http://127.0.0.1:${address.port}`);
            if (runtime.events.length !== 3 || runtime.events.some(event => event.status !== 200 || !event.demo)) {
              throw new Error('Expected three successful, labeled demo interactions.');
            }
            // No key, environment dump, headers, credential, or raw response is logged.
            console.log(JSON.stringify({
              result: 'passed', provider: generation.provider,
              nodes: generation.plan.nodes.length, successfulRequests: runtime.events.length,
              snapshotHash: snapshot.hash,
            }, null, 2));
          } catch (error) {
            // Preserve a useful failure message while explicitly redacting the exact key.
            const key = process.env.MODEL_API_KEY;
            const message = error instanceof Error ? error.message : 'Unknown failure';
            console.error(key ? message.split(key).join('[REDACTED]') : message);
            process.exitCode = 1;
          } finally {
            if (server?.listening) {
              server.closeAllConnections();
              await new Promise(resolve => server.close(resolve));
            }
          }
          JS
